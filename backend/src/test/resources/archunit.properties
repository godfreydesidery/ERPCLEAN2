# ArchUnit FreezingArchRule store (tenant-isolation guard — TenantScopingRulesTest).
# The baseline of pre-existing, audited by-id lookups lives in src/test/resources/archunit_freeze.
# allowStoreUpdate=false => NEW violations FAIL the build (regression guard); they are NOT
# silently grandfathered.
#
# NOTE: the freeze store records each violation WITH its file:line, so a refactor that MOVES an
# existing (already-frozen) findById/getReferenceById call makes the old entry obsolete and CI
# fails (StoreUpdateFailedException). To regenerate after such a refactor (or to add a reviewed
# exception): delete src/test/resources/archunit_freeze/*, run once with
# -Dfreeze.store.default.allowStoreUpdate=true (creates a fresh baseline), confirm the count is
# unchanged unless you intended new exceptions, then re-lock to false and commit the store.
freeze.store.default.path=src/test/resources/archunit_freeze
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=false
