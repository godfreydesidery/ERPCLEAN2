# Disable Ryuk (the resource-reaper sidecar). On this Docker Desktop / Windows setup Ryuk
# interferes with port mapping, causing "Connection to localhost:<port> refused" during the
# Spring context start. Disabling it makes integration tests reliable.
ryuk.disabled=true

# Reuse is OFF (see PostgresIntegrationTest): the pre-stable baseline is edited between runs, so a
# fresh container each run re-applies the current schema. The singleton-per-JVM pattern already
# gives speed across IT classes within a run. Orphans from an interrupted run: `docker container prune`.
testcontainers.reuse.enable=false
