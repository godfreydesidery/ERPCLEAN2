# Dev-mode overrides. Activate with: --spring.profiles.active=dev
# Hot-reload iteration against the compose Postgres. NOT for release sign-off.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/erp
    username: erp
    password: erp
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug
    com.erp: debug
