spring:
  application:
    name: erp-api
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5434/erp}
    username: ${ERP_DB_USER:erp}
    password: ${ERP_DB_PASSWORD:erp}
  jpa:
    hibernate:
      # PROJECT-CONVENTIONS §3.6: schema owned by Flyway, never auto-managed.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # ── Migration safety on a DURABLE, multi-tenant DB (prod/QA are no longer ephemeral) ──
    # These mirror Flyway's own defaults where noted, but are pinned here so the policy is
    # explicit and version-controlled rather than relying on an unstated default. No code or
    # test invokes flyway clean, so disabling it everywhere costs nothing.
    #
    # clean is a full data-drop; never allow it against any persistent ERP database.
    clean-disabled: true
    # Checksum drift on an already-applied migration must FAIL FAST at boot — never silently
    # re-run or skip. (Flyway default true; pinned to make the policy auditable.)
    validate-on-migrate: true
    # Strict version order. A lower-versioned migration arriving AFTER a higher one (the classic
    # parallel-feature-branch case) is rejected, not silently interleaved. (Flyway default false.)
    out-of-order: false
    # Never auto-baseline. A restored pg_dump carries flyway_schema_history with it, so a real
    # restore needs no baseline. Auto-baselining a history-less HEAD dump would mark V1 applied
    # then re-run V2..HEAD onto an existing schema = mass failure. Adopt legacy DBs manually.
    baseline-on-migrate: false

server:
  # 8081 by default (8080 is often taken by another local app); override with ERP_API_PORT.
  port: ${ERP_API_PORT:8081}

management:
  # D-5: Separate management port — Prometheus never reachable from the public 8081 edge.
  # All actuator endpoints (health/info/prometheus) move to this port when it is set.
  server:
    port: ${ERP_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # health + info for ops dashboards; prometheus for Micrometer scraping (D-5).
        # Prometheus is only reachable on the management port (9090), not on 8081.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # D-4: split readiness vs liveness so orchestrators get clean probe targets.
      # GET /actuator/health/liveness  — is the process alive?
      # GET /actuator/health/readiness — is the app ready to serve traffic? (includes DB indicator)
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# OpenAPI / Swagger UI (ADR-0038 D-9).
# Default true so dev/QA can browse the spec at /swagger-ui/index.html and /v3/api-docs.
# Set ERP_SWAGGER_ENABLED=false in production to remove the docs surface.
# SecurityConfig permits /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html — see SecurityConfig.java.
springdoc:
  swagger-ui:
    enabled: ${ERP_SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${ERP_SWAGGER_ENABLED:true}

erp:
  jwt:
    # dev-in-memory: an ephemeral RSA key is generated at startup (rotates each restart → all
    # tokens invalidated). Fine for dev. PRODUCTION must load a stable RS256 key from a secret
    # store (signing-mode=file with the key paths) — gating item for security + devops before deploy.
    signing-mode: ${ERP_JWT_SIGNING_MODE:dev-in-memory}
    private-key-location: ${ERP_JWT_PRIVATE_KEY:}
    public-key-location: ${ERP_JWT_PUBLIC_KEY:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    issuer: erp-api
  security:
    lockout:
      max-failed-attempts: 5
      lock-minutes: 15
    password:
      min-length: 8
  bootstrap:
    # On a fresh DB (no organisation), create org + company + default branch + root admin from env.
    enabled: ${ERP_BOOTSTRAP_ENABLED:false}
    organisation-name: ${ERP_BOOTSTRAP_ORG_NAME:Default Organisation}
    company-code: ${ERP_BOOTSTRAP_COMPANY_CODE:C1}
    company-name: ${ERP_BOOTSTRAP_COMPANY_NAME:Default Company}
    branch-code: ${ERP_BOOTSTRAP_BRANCH_CODE:BR-01}
    branch-name: ${ERP_BOOTSTRAP_BRANCH_NAME:Head Office}
    admin-username: ${ERP_BOOTSTRAP_ADMIN_USERNAME:rootadmin}
    admin-display-name: ${ERP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Root Administrator}
    # Password MUST be provided (>= 12 chars, not a placeholder) when bootstrap is enabled, or the
    # app refuses to start. Never defaulted.
    admin-password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
    time-zone: ${ERP_BOOTSTRAP_TIME_ZONE:Africa/Dar_es_Salaam}
    # Currency policy for the bootstrap company (ADR-0039 D-9). Defaults: Classic EAC-6 + USD + EUR.
    currency:
      base: ${ERP_BOOTSTRAP_CURRENCY_BASE:TZS}
      default-currency: ${ERP_BOOTSTRAP_CURRENCY_DEFAULT:TZS}
      enabled: ${ERP_BOOTSTRAP_CURRENCY_ENABLED:TZS,KES,UGX,RWF,BIF,SSP,USD,EUR}
