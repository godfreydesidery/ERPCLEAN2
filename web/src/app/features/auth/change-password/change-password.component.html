<section class="container-fluid py-3" aria-labelledby="changePasswordTitle">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 id="changePasswordTitle" class="h5 mb-3">Change password</h1>

          @if (forced()) {
            <div class="alert alert-warning small" role="status">
              Your administrator set a temporary password for you. Choose your own password to continue.
            </div>
          }

          <form (ngSubmit)="submit()" aria-label="Change password" novalidate>
            <div class="mb-3">
              <label class="form-label small text-muted mb-1" for="currentPassword">Current password</label>
              <input id="currentPassword" name="currentPassword" type="password" class="form-control"
                     autocomplete="current-password" required
                     [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)"
                     [disabled]="saving()" />
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted mb-1" for="newPassword">New password</label>
              <input id="newPassword" name="newPassword" type="password" class="form-control"
                     autocomplete="new-password" required aria-describedby="newPasswordHelp"
                     [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
                     [disabled]="saving()" />
              <div id="newPasswordHelp" class="form-text small">
                Use letters and at least one number. Avoid common passwords.
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted mb-1" for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                     autocomplete="new-password" required
                     [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
                     [disabled]="saving()" />
            </div>

            @if (error(); as msg) {
              <p class="text-danger small" role="alert">{{ msg }}</p>
            }

            <button type="submit" class="btn btn-primary w-100" [disabled]="saving()">
              @if (saving()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Saving…
              } @else {
                Change password
              }
            </button>
            <p class="text-muted small mt-3 mb-0">
              Changing your password signs you out on every other device.
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
