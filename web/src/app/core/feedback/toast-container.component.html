<div class="toast-stack" aria-live="assertive" aria-atomic="true">
  @for (t of toasts.toasts(); track t.id) {
    <div class="toast-item toast-{{ t.kind }}" role="alert">
      <i class="bi {{ icon(t.kind) }} toast-icon" aria-hidden="true"></i>
      <span class="toast-message">{{ t.message }}</span>
      <button type="button" class="toast-close" aria-label="Dismiss" (click)="toasts.dismiss(t.id)">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
