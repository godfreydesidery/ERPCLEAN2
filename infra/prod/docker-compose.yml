# REFERENCE ONLY — not the canonical prod unit.
#
# This file describes a single-node, single-host topology for ERPCLEAN2: the API
# (with the Angular SPA embedded) + a dedicated Postgres 15 container.  It is a
# starting-point reference for operators and for smoke-testing the prod image
# locally.  A real production deployment may use a managed Postgres service, a load
# balancer, and secret injection from a vault — those concerns are owned outside this
# file (see docs/ops/backup-restore.md and docs/ops/jwt-keys.md).
#
# Pre-requisites (ONE-TIME per host):
#   1. Copy infra/prod/.env.example → infra/prod/.env and fill in every placeholder.
#   2. Run infra/prod/generate-jwt-keys.sh to emit private.pem + public.pem into
#      infra/prod/jwt-keys/ (gitignored).
#   3. docker compose -f infra/prod/docker-compose.yml up -d
#
# Reverse-proxy (Caddy / nginx with Let's Encrypt) terminates TLS in front of this
# stack.  The API container serves plain HTTP on 8081; do NOT expose it directly to
# the internet without TLS termination.

services:

  # -----------------------------------------------------------------------
  # PostgreSQL 15 — the only data store for ERPCLEAN2.
  # Credentials, DB name, and port come from .env (gitignored).
  # -----------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: erp-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - erp-prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Do NOT expose the Postgres port to the host in production — only the API
    # container needs it.  Uncomment the line below ONLY for emergency DBA access
    # on a private network, and close it again afterwards.
    # ports:
    #   - "127.0.0.1:5432:5432"

  # -----------------------------------------------------------------------
  # ERPCLEAN2 API — Spring Boot fat jar + Angular SPA (built in Stage 2/3 of
  # infra/prod/Dockerfile).  Profile=prod enables JSON logging, readiness probes,
  # and requires a stable RS256 key (ERP_JWT_SIGNING_MODE=file).
  # -----------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
    image: erpclean2:prod
    container_name: erp-prod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Profile is ALWAYS prod here — overrides any value in .env.
      SPRING_PROFILES_ACTIVE: prod
      # Canonical API port — matches EXPOSE in the Dockerfile.
      ERP_API_PORT: "8081"
      # JWT signing from PEM files (mounted below). The key paths must be set in .env.
      ERP_JWT_SIGNING_MODE: file
      # Datasource — points at the db service above.
      ERP_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      ERP_DB_USER: ${POSTGRES_USER}
      ERP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # ${ERP_API_HOST_PORT:-8081} lets operators remap without editing this file.
      # In prod the TLS reverse-proxy forwards to this port; exposing it on 0.0.0.0
      # is intentional so the proxy (on the host or a separate container) can reach it.
      - "${ERP_API_HOST_PORT:-8081}:8081"
    volumes:
      # JWT key files — generated by infra/prod/generate-jwt-keys.sh (gitignored).
      # The paths inside the container must match ERP_JWT_PRIVATE_KEY / ERP_JWT_PUBLIC_KEY in .env.
      - ./jwt-keys:/run/secrets/jwt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  erp-prod-db-data:
    name: erp-prod-db-data
