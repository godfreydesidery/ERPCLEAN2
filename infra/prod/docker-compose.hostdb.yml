# Production variant: API (+ Angular SPA) in Docker, PostgreSQL installed NATIVELY on the host.
#
# Use this instead of docker-compose.yml when you do NOT want Postgres in a container.
# Postgres stays bound to localhost on the host (never exposed off-box); the API container
# uses host networking so it reaches the DB at 127.0.0.1:5432.
#
# Pre-requisites (ONE-TIME per host):
#   1. Install + init native Postgres 15, create the `erp` role + DB (see docs/ops or the
#      runbook). Postgres must accept scram-sha-256 password auth from 127.0.0.1.
#   2. cp infra/prod/.env.example infra/prod/.env and fill it in. POSTGRES_PASSWORD MUST
#      equal the password you gave the native `erp` role.
#   3. bash infra/prod/generate-jwt-keys.sh  (emits jwt-keys/private.pem + public.pem).
#   4. docker compose -f infra/prod/docker-compose.hostdb.yml up -d --build
#
# A reverse proxy (Caddy / nginx + Let's Encrypt) terminates TLS in front and forwards to
# the API on 127.0.0.1:8081. Do NOT open 8081 to the internet in the security group.

services:

  # -----------------------------------------------------------------------
  # ERPCLEAN2 API — Spring Boot fat jar + Angular SPA (built by infra/prod/Dockerfile).
  # host networking → binds ${ERP_API_PORT} on the host and reaches native Postgres on
  # 127.0.0.1:5432. profile=prod requires a stable RS256 key (ERP_JWT_SIGNING_MODE=file).
  # -----------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
    image: erpclean2:prod
    container_name: erp-prod-api
    restart: unless-stopped
    # Host networking: the container shares the host network stack, so it connects to the
    # native Postgres on 127.0.0.1 and binds the API port directly on the host. With this
    # mode, `ports:` is ignored — the app listens on ${ERP_API_PORT} (default 8081) on the host.
    network_mode: host
    env_file:
      - .env
    environment:
      # Profile is ALWAYS prod here — overrides any value in .env.
      SPRING_PROFILES_ACTIVE: prod
      ERP_API_PORT: "${ERP_API_PORT:-8081}"
      # JWT signing from the mounted PEM files (paths set in .env -> /run/secrets/jwt/).
      ERP_JWT_SIGNING_MODE: file
      # Datasource → native Postgres on the host loopback.
      ERP_DB_URL: jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB}
      ERP_DB_USER: ${POSTGRES_USER}
      ERP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Behind the Caddy reverse proxy (TLS is terminated there) — honour X-Forwarded-*
      # so the app sees the original https scheme/host.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      # JWT key files — generated by infra/prod/generate-jwt-keys.sh (gitignored).
      - ./jwt-keys:/run/secrets/jwt:ro
    healthcheck:
      # Port 9090, not 8081: actuator is served on the management port (application.yml
      # sets management.server.port). Probing 8081 returns 404 and marks a perfectly
      # healthy container as (unhealthy) — that was the long-standing false alarm here.
      # With network_mode: host the management port is on the host loopback, so 127.0.0.1
      # still reaches it. start_period covers Flyway migrating on first boot.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # -----------------------------------------------------------------------
  # Caddy — TLS reverse proxy in front of the API. Currently self-signed (Caddy's
  # internal CA) because there is no domain yet; browsers will show a "not trusted"
  # warning. To get a real Let's Encrypt cert later, just edit infra/prod/Caddyfile
  # to use your domain (see the comment in that file) and `up -d` again.
  # Host networking so it binds 80/443 on the host and reaches the API on localhost:8081.
  # -----------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: erp-prod-caddy
    restart: unless-stopped
    network_mode: host
    # .env provides ERP_PUBLIC_HOST, which the Caddyfile binds its site to.
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persists the internal CA + issued certs across restarts
      - caddy-config:/config

volumes:
  caddy-data:
    name: erp-prod-caddy-data
  caddy-config:
    name: erp-prod-caddy-config
