[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
silent=false
loglevel=info

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopsignal=INT
stopwaitsecs=30

# Spring Boot is gated on Postgres being reachable — the wrapper waits for the
# local 5432 socket before exec'ing java, so this program just retries until up.
[program:api]
command=/opt/erpclean2/start-api.sh
autostart=true
autorestart=true
startretries=20
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
stopsignal=TERM
stopwaitsecs=20
