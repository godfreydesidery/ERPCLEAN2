name: Backend CI

# ADR-0038 D-8: the Java backend (compile, unit tests, ArchUnit boundary/auth gates, and the
# ~100 Testcontainers Postgres integration tests) had NO CI before this — it ran only on
# developer machines. Linux GitHub runners ship Docker, so the failsafe ITs run here for the
# first time. Two jobs: a fast, REQUIRED unit/architecture gate on every PR; and a slower,
# observe-only (non-required) integration-test job until it has proven stable across several runs.

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    working-directory: backend

jobs:
  # ── Job 1: REQUIRED — compile + unit tests + ArchUnit boundary/auth gates ──────────────
  # surefire phase only (no Testcontainers); fast (~2-3 min). This is the PR gate.
  fast-check:
    name: Compile + unit + architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `test` runs surefire (unit + ArchUnit ModuleBoundaryTest / EndpointAuthorizationTest);
      # it does NOT run the failsafe ITs (those are the verify phase, in job 2).
      - name: Compile + unit + architecture tests
        run: mvn -B -ntp clean test

  # ── Job 2: REQUIRED — full Testcontainers integration suite ────────────────────────────
  # Linux runners have Docker; the singleton-per-JVM Postgres container + Ryuk-disabled pattern
  # (PostgresIntegrationTest / testcontainers.properties) works on the runner. This is the ONLY
  # job that exercises real Postgres behaviour — including the keep-data forward-migration test
  # (MigrationKeepDataIT) that proves migrations apply onto a populated, pre-existing DB.
  # Promoted from observe-only to a required gate (ADR-0038 follow-up: migration/seeding hardening).
  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Full clean verify = surefire + failsafe ITs. `clean` is deliberate: ADR-0038 risk note —
      # an incremental compile gave a false green in Wave 2; the clean build is the source of truth.
      - name: Clean verify (unit + integration)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: mvn -B -ntp clean verify

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports/
          retention-days: 7

  # ── Job 3: REQUIRED — Flyway migration hygiene ─────────────────────────────────────────
  # Guards a DURABLE database against failure modes the "build schema from V1 on an empty DB"
  # tests cannot see (see scripts/check-migrations.sh):
  #   Rule 1 (ON): no two migrations share a version. A duplicate version (e.g. two feature
  #                branches both adding V65__) makes Flyway fail at startup on every environment.
  #   Rule 2 (immutability, ON since the 2026-06-20 schema freeze): an applied migration must never
  #                be edited/renamed/deleted — its checksum would drift and the app refuses to boot
  #                (validate-on-migrate) on the durable QA/prod DB. Corrections are NEW Vn migrations
  #                (or, for convergent reference data, an edit to the repeatable R__ file).
  migration-hygiene:
    name: Migration hygiene (versions + immutability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Rule 2 can diff against the base branch
      - name: Check Flyway migration hygiene
        # Rule 1 (always) + Rule 2 (immutability vs the PR base branch).
        run: BASE=origin/${{ github.base_ref || 'main' }} bash ../scripts/check-migrations.sh
