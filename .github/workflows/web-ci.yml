name: Web CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    working-directory: web

jobs:
  # ── Job 1: build + unit tests (incl. axe a11y specs) ───────────────────────
  build-and-test:
    name: Build & unit test (incl. a11y)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Unit tests (vitest + axe a11y gate)
        run: npm test -- --watch=false

  # ── Job 2: Playwright e2e (opt-in / manual; needs running backend) ──────────
  e2e:
    name: Playwright e2e (opt-in)
    runs-on: ubuntu-latest
    # This job is intentionally NOT triggered automatically.
    # Run it manually via workflow_dispatch or remove the `if: false` when
    # a backend test environment is wired up in CI.
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run Playwright e2e
        run: npm run e2e
        env:
          ROOT_PASS: ${{ secrets.ROOT_PASS }}
          PLAYWRIGHT_REUSE_SERVER: ''

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
