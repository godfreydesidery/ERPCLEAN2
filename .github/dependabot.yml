# ADR-0038 D-11: automated dependency hygiene. Weekly PRs for the backend (Maven), the web app
# (npm), and the GitHub Actions workflows themselves. Grouped to keep PR volume manageable; the
# Backend CI / Web CI workflows gate each update PR, so a bad bump fails its own check.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
